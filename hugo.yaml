baseURL: https://ryhan.tech
languageCode: en-us
title: Ryhan's Blog
theme: ["PaperMod"]
contentDir: content
module:
  mounts:
  - source: attachements
    target: content

menu:
  main:
    - identifier: archive
      name: archive
      url: /posts/
      weight: 10
    - identifier: twitter
      name: twitter
      url: https://x.com/ryhan_fgc
      weight: 20
    - identifier: github
      name: Github
      url: https://github.com/ryhanshannon
      weight: 30

params:
  homeInfoParams:
    Title: Ryhan's Blog
    Content: Infosec, fighting games, side projects

  ShowFullTextinRSS: true
  socialIcons: # optional
    - name: "rss"
      url: "/index.xml"
    - name: "twitter"
      url: "twitter.com/ryhan_fgc"
    - name: "discord"
      url: "discord.com"
    - name: "twitch"
      url: "discord.com"
      

  ShowShareButtons: true
  ShareButtons: ["x", "reddit", "ycombinator", discord]

  ShowReadingTime: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true

  comments: true


outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

